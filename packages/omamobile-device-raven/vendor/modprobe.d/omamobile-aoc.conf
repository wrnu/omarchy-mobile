# SPDX-License-Identifier: MIT
# AoC (device/raven/AUDIO-PLAN.md): only omamobile-aoc-start (or the bring-up
# stages) load these, in order. Explicit modprobe still works.
blacklist gsa
blacklist gs201_aoc_sysmmu
blacklist gs201_aoc_boot
blacklist mailbox_wc
blacklist aoc_core
blacklist aoc_channel_dev
blacklist aoc_char_dev
# The sound card's driver would load at boot and pull aoc_core, gsa and Trusty
# in ahead of the order above; omamobile-aoc-start loads it with the others.
blacklist aoc_alsa_dev
blacklist aoc_alsa_dev_util

# The speakers' kernel ceiling at stock's analog 17 (aoc_speaker_limits; 10
# without it), as on cheetah. Only the raised ceiling: omamobile-audio's
# speaker service picks the levels, and runs above analog 10 only with
# verified protection (a stamp or a verified-firmware entry for raven's
# firmware; device/raven/AUDIO-PLAN.md "C9 on raven"). Was a hand-placed
# bring-up file (omamobile-audio-c9-bringup.conf) until 2026-11-02.
options aoc_alsa_dev speaker_protection=1
