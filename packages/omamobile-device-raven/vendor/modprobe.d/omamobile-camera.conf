# SPDX-License-Identifier: MIT
# The camera drivers don't autoload: omamobile-camera-start (from
# omamobile-camera.timer, 40 s into the boot) loads them in order, and the
# bring-up runbooks (device/raven/CAMERA-PLAN.md) load them by hand.
# Explicit modprobe still works.
#
# The S2MPG11 GPIOs do autoload: binding them lets the camera PMIC's
# converter supplies probe, which holds their enables low.
#
# SLG51000 camera PMIC: powers up at probe to read its configuration.
blacklist slg51000_regulator
# The sysfs switch for an LDO in the camera-eeprom-test overlay (RC1.3).
blacklist userspace_consumer
# Capture path: the IMX386 and S5KGN1 sensors (each powers its module at
# probe to read its ID), the DC-PHY receiver and the CSIS link + WDMA driver.
blacklist imx386
blacklist s5kgn1
blacklist phy_gs201_mipi_dcphy_rx
blacklist gs201_csis
