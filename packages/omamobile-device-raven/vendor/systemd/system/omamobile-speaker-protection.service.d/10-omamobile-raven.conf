# omamobile-audio's speaker service starts only where cheetah's AoC
# (181d0000.aoc) exists; raven's AoC is 175d0000.aoc. Raven's protection was
# verified on 2026-11-02 (device/raven/AUDIO-PLAN.md "C9 on raven"), so the
# service runs here too. The empty line resets the package's condition.
[Unit]
ConditionPathExists=
ConditionPathExists=/sys/bus/platform/devices/175d0000.aoc
